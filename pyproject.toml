[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-librarian"
version = "0.1.0"
description = "Personal Librarian RAG application with PostgreSQL + pgvector"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "Corinne", email = "your-email@example.com"}
]
license = {text = "MIT"}
dependencies = [
    "langchain-postgres",
    "langchain-community",
    "langchain-openai",
    "psycopg[binary]",
    "python-dotenv",
    "langchain-text-splitters",
    "langchain-core",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "flake8",
    "coverage",
]

[project.scripts]
personal-librarian-ingest = "personal_librarian.ingest:main"
personal-librarian-agent = "personal_librarian.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
personal_librarian = ["py.typed"]
